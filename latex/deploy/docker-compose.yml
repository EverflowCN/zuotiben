name: everflow-aldine
services:
  app:
    image: ghcr.io/trahloff/aldine-app:${ALDINE_VERSION:-0.11.0}
    ports:
      - "${ALDINE_APP_BIND:-127.0.0.1}:${ALDINE_APP_PORT:-8080}:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      META_DIR: /secrets
      COMPILER_URL: http://compiler:4020
      ALDINE_BASE_PATH: /latex
      ALDINE_PUBLIC_URL: ${ALDINE_PUBLIC_URL:-https://zuotiben.top/latex}
      AUTH_ENABLED: "1"
      ALDINE_ADMIN_EMAILS: ${ALDINE_ADMIN_EMAILS:-}
      ALDINE_COMPILE_PER_MIN: ${ALDINE_COMPILE_PER_MIN:-2}
      ALDINE_COMPILE_QUOTA_MIN: ${ALDINE_COMPILE_QUOTA_MIN:-30}
      ALDINE_MCP: "0"
    volumes:
      - aldine-data:/data
      - aldine-secrets:/secrets
    depends_on:
      compiler:
        condition: service_healthy
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks: [public-egress, isolated-compiler]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
  compiler:
    image: ghcr.io/trahloff/aldine-compiler:${ALDINE_VERSION:-0.11.0}${ALDINE_TEXLIVE:--full}
    environment:
      PORT: "4020"
      DATA_DIR: /data
      COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-120000}
      MAX_CONCURRENT_COMPILES: ${MAX_CONCURRENT_COMPILES:-1}
    volumes:
      - aldine-data:/data
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://localhost:4020/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    networks: [isolated-compiler]
    mem_limit: 2g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    init: true
    restart: unless-stopped
networks:
  public-egress: {}
  isolated-compiler:
    internal: true
volumes:
  aldine-data:
  aldine-secrets:
