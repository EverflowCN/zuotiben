<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>浏览器 XeLaTeX 实验 · Everflow</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;background:#f8f8f6;color:#272727}*{box-sizing:border-box}body{margin:0}.top{min-height:66px;background:#fff;border-bottom:1px solid #e4e4e0;display:flex;align-items:center;gap:16px;padding:15px clamp(16px,4vw,48px);flex-wrap:wrap}.logo{font-weight:680}.sub{font-size:12px;color:#727272}.top a{color:#343434;text-decoration:none}.top a:hover{text-decoration:underline}main{max-width:1500px;margin:0 auto;padding:24px clamp(16px,3vw,42px)}.hint{border:1px solid #e4e0d0;background:#fffcf3;border-radius:12px;padding:12px 17px;font-size:13px;line-height:1.65;margin-bottom:19px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:11px;margin-bottom:13px}button,.file{border-radius:9px;border:1px solid #d8d8d4;padding:9px 14px;background:white;cursor:pointer;font:inherit;font-size:13px}button.primary{background:#333;color:white;border-color:#333}button:disabled{opacity:.55;cursor:default}button:hover:not(:disabled){filter:brightness(.93)}.file input{display:none}.actions label{font-size:13px;color:#545454}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.panel{border:1px solid #dddcd8;border-radius:13px;background:#fff;overflow:hidden}.panel h2{font-size:13px;padding:13px 16px;margin:0;border-bottom:1px solid #eae9e6;color:#4e4e4e}textarea{width:100%;height:64vh;min-height:350px;resize:vertical;padding:18px 20px;background:white;color:#202020;border:0;outline:0;font:14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}iframe{width:100%;height:64vh;min-height:350px;border:0;background:#eee}.log{border:1px solid #dddcd8;border-radius:10px;background:#fff;margin-top:14px}.log summary{padding:12px 16px;cursor:pointer;font-size:13px}.log pre{padding:0 16px 14px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;font:12px/1.6 ui-monospace,Consolas,monospace}#status{font-size:12px;color:#555;flex:1;min-width:170px}@media(max-width:770px){.grid{grid-template-columns:1fr}textarea,iframe{height:48vh;min-height:300px}}
</style></head>
<body>
<header class="top"><div class="logo">Everflow · 浏览器 XeLaTeX</div><span class="sub">BusyTeX WASM 技术验证</span><a href="/latex/?local=1">完整浏览器工作区 ↗</a><a href="/latex/">返回 Aldine 编辑器</a><a href="/paper/">做题本</a></header>
<main>
<div class="hint"><b>独立实验，不替换原版 Aldine。</b> 本页使用你复刻的 TeXlyre-BusyTeX 在用户浏览器编译，不需要安装 LaTeX，也不使用 Aldine 后端。首次使用需要自动下载约 120 MB 的引擎及基础 TeX Live 资源；复杂中文字体和宏包可能需要远程补充，尚未验证 Everflow 原模板兼容性。</div>
<div class="actions">
<button id="compile" class="primary" type="button">开始 XeLaTeX 编译</button>
<label class="file">导入 .tex<input id="file" type="file" accept=".tex,.txt"></label>
<label><input id="remote" type="checkbox" checked> 允许按需获取宏包</label>
<button id="download" type="button" hidden>下载 PDF</button>
<span id="status" role="status">尚未运行；编译引擎于首次点击后加载。</span>
</div>
<div class="grid">
<section class="panel"><h2>LaTeX 源代码 · main.tex</h2><textarea id="source" spellcheck="false" aria-label="main.tex 源代码"></textarea></section>
<section class="panel"><h2>PDF 预览</h2><iframe id="preview" title="编译生成的 PDF"></iframe></section>
</div>
<details class="log" open><summary>编译日志</summary><pre id="log">尚无日志。</pre></details>
</main><script type="module" src="./app.mjs"></script>
</body></html>
