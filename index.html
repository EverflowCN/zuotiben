<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Everflow 免费做题本与学习资料分享页" />
  <title>Everflow · 免费做题本</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="paper-noise" aria-hidden="true"></div>

  <header class="hero">
    <div class="hero-inner">
      <div class="brand-row">
        <div class="brand-mark">E</div>
        <div class="eyebrow">EVERFLOW · OPEN RESOURCES</div>
      </div>
      <h1>免费做题本</h1>
      <p class="lead">集中收录可公开获取的做题本与学习资料。无需登录，直接打开；需要转发时，可一键复制资源链接。</p>
      <div class="hero-meta">
        <span>公开访问</span>
        <span>持续更新</span>
        <span>免费使用</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section-head">
      <div>
        <span class="kicker">RESOURCE LIBRARY</span>
        <h2>资源列表</h2>
      </div>
      <p id="resourceCount" class="count"></p>
    </section>

    <section id="resourceGrid" class="resource-grid" aria-live="polite"></section>

    <section class="notice">
      <h3>使用说明</h3>
      <p>页面仅用于学习资料索引与公开分享。资源如涉及第三方内容，请遵守相应版权、授权与平台规则。</p>
    </section>
  </main>

  <footer>
    <div>Everflow · 彼时流年若水</div>
    <div>zuotiben.top</div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite">链接已复制</div>
  <script src="./app.js"></script>
</body>
</html>
