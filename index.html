<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="考研做题本与学习资料分类索引" />
  <meta name="theme-color" content="#ffffff" />
  <title>做题本 · 考研资料分类索引</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="做题本首页">
        <span class="brand-symbol" aria-hidden="true">本</span>
        <span class="brand-name">做题本</span>
      </a>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 21-4.35-4.35m2.35-5.15A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索 408、数学二、法硕、真题……" autocomplete="off" />
        <kbd>/</kbd>
      </label>

      <div class="site-domain">zuotiben.top</div>
    </div>
  </header>

  <main class="shell">
    <aside class="sidebar" aria-label="考研资料大类">
      <div class="sidebar-section">
        <div class="sidebar-title">考试大类</div>
        <nav id="categoryNav" class="category-nav"></nav>
      </div>

      <div class="sidebar-section sidebar-info">
        <div class="sidebar-title">分类方式</div>
        <p>按站内使用场景整理为“大类 → 科目 → 做题本类型”。这只是本站目录结构，不等同于官方学科或专业目录。</p>
      </div>
    </aside>

    <section class="content">
      <div class="content-head">
        <div>
          <div class="breadcrumb">
            <span id="currentCategory">全部</span>
            <span class="crumb-sep">/</span>
            <span id="currentSubject">全部科目</span>
            <span class="crumb-sep">/</span>
            <span id="currentType">全部类型</span>
          </div>
          <h1 id="pageTitle">全部做题本</h1>
          <p class="content-desc">同一科目可同时收录真题、章节、强化、错题、模拟、冲刺等不同做题本。</p>
        </div>
        <div id="resourceCount" class="result-count"></div>
      </div>

      <section class="filter-block" aria-label="科目筛选">
        <div class="filter-label">科目</div>
        <div id="subjectNav" class="subject-nav"></div>
      </section>

      <section class="filter-block type-filter" aria-label="做题本类型筛选">
        <div class="filter-label">类型</div>
        <div id="typeNav" class="subject-nav"></div>
      </section>

      <div class="toolbar">
        <div class="toolbar-left">按最近更新排列</div>
        <div class="view-note">资源列表</div>
      </div>

      <div id="resourceList" class="resource-list" aria-live="polite"></div>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-title">这个分类暂时还没有收录做题本</div>
        <p>目录已经预留，后续有对应资料时会直接归入这里。</p>
      </div>

      <section class="site-note">
        <h2>使用说明</h2>
        <p>本站只提供资料索引与跳转。资源如涉及第三方内容，请遵守相应版权、授权与平台规则。</p>
      </section>
    </section>
  </main>

  <footer class="footer">
    <span>Everflow · 彼时流年若水</span>
    <span>zuotiben.top</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite">链接已复制</div>
  <script src="./app.js"></script>
</body>
</html>
