<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="做题本 - 免费学习资料索引" />
  <meta name="theme-color" content="#ffffff" />
  <title>做题本 · 免费资料索引</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="做题本首页">
        <span class="brand-symbol" aria-hidden="true">本</span>
        <span class="brand-name">做题本</span>
      </a>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 21-4.35-4.35m2.35-5.15A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索资料、科目或关键词" autocomplete="off" />
        <kbd>/</kbd>
      </label>

      <a class="top-link" href="https://github.com/EverflowCN/zuotiben" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </div>
  </header>

  <main class="shell">
    <aside class="sidebar" aria-label="资料分类">
      <div class="sidebar-section">
        <div class="sidebar-title">资料</div>
        <nav id="categoryNav" class="category-nav"></nav>
      </div>

      <div class="sidebar-section sidebar-info">
        <div class="sidebar-title">关于</div>
        <p>公开学习资料索引。点击资源可直接打开，也可以复制地址转发。</p>
      </div>
    </aside>

    <section class="content">
      <div class="content-head">
        <div>
          <div class="breadcrumb">资源库 / <span id="currentCategory">全部</span></div>
          <h1 id="pageTitle">全部资料</h1>
          <p class="content-desc">按科目整理的免费做题本与学习资料。</p>
        </div>
        <div id="resourceCount" class="result-count"></div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <button class="sort-button active" type="button">最近更新</button>
        </div>
        <div class="view-note">列表视图</div>
      </div>

      <div id="resourceList" class="resource-list" aria-live="polite"></div>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-title">没有找到匹配的资料</div>
        <p>换一个关键词，或切换到其他分类。</p>
      </div>

      <section class="site-note">
        <h2>使用说明</h2>
        <p>本站只提供资料索引与跳转。资源如涉及第三方内容，请遵守相应版权、授权与平台规则。</p>
      </section>
    </section>
  </main>

  <footer class="footer">
    <span>Everflow · 彼时流年若水</span>
    <span>zuotiben.top</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite">链接已复制</div>
  <script src="./app.js"></script>
</body>
</html>
