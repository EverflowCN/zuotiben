name: Load trusted build input
description: Read a private build dependency into runner temporary storage without publishing it.
inputs:
  repository:
    description: Repository in owner/name format.
    required: true
  token:
    description: Read-only token scoped to the dependency repository.
    required: true
  ref:
    description: Branch of the dependency repository.
    required: false
    default: main
outputs:
  directory:
    description: Absolute path to the temporary private build input.
    value: ${{ steps.stage.outputs.directory }}
runs:
  using: composite
  steps:
    - name: Load dependency directly into temporary storage
      id: stage
      shell: bash
      env:
        SOURCE_REPOSITORY: ${{ inputs.repository }}
        SOURCE_TOKEN: ${{ inputs.token }}
        SOURCE_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        if [[ ! "$SOURCE_REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
          echo '::error::Invalid repository identifier.'
          exit 1
        fi
        if [[ -z "$SOURCE_TOKEN" || -z "$SOURCE_REF" ]]; then
          echo '::error::Missing build input credentials or branch.'
          exit 1
        fi
        dest="$RUNNER_TEMP/build-input-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        if [[ -e "$dest" ]]; then
          echo '::error::Temporary source destination already exists.'
          exit 1
        fi
        # Configure auth only for this git process, never in a URL or .git/config.
        authorization="$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 | tr -d '\n')"
        GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization" \
          git clone --quiet --depth 1 --single-branch --branch "$SOURCE_REF" \
          "https://github.com/$SOURCE_REPOSITORY.git" "$dest"
        unset authorization
        chmod 700 "$dest"
        printf 'directory=%s\n' "$dest" >> "$GITHUB_OUTPUT"
        echo 'Build input is available in runner temporary storage.'
