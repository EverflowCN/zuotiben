name: Load trusted build input
description: Load a read-only build dependency into runner temporary storage without publishing it.
inputs:
  repository:
    description: Repository in owner/name format.
    required: true
  token:
    description: Read-only token scoped to the dependency repository.
    required: true
  ref:
    description: Ref of the dependency repository.
    required: false
    default: main
outputs:
  directory:
    description: Absolute path to the temporary private build input.
    value: ${{ steps.stage.outputs.directory }}
runs:
  using: composite
  steps:
    - name: Check out dependency with ephemeral credentials
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        path: .build-dependency
        persist-credentials: false
    - name: Move dependency outside deployable workspace
      id: stage
      shell: bash
      run: |
        set -euo pipefail
        source="$GITHUB_WORKSPACE/.build-dependency"
        dest="$RUNNER_TEMP/build-input-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        test -d "$source/.git" || { echo '::error::Dependency checkout failed'; exit 1; }
        test ! -e "$dest" || { echo '::error::Temporary destination already exists'; exit 1; }
        mv "$source" "$dest"
        chmod 700 "$dest"
        printf 'directory=%s\n' "$dest" >> "$GITHUB_OUTPUT"
        echo 'Build input checked out to runner temporary storage.'
