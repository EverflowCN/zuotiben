name: Load trusted build input
description: Download a private repository's source archive directly into temporary runner storage.
inputs:
  repository:
    description: Repository in owner/name format.
    required: true
  token:
    description: Fine-grained PAT scoped to the private repository with Contents Read-only.
    required: true
  ref:
    description: Branch of the private repository.
    required: false
    default: main
outputs:
  directory:
    description: Absolute path to the temporary private build input.
    value: ${{ steps.stage.outputs.directory }}
runs:
  using: composite
  steps:
    - name: Fetch private source via GitHub archive API
      id: stage
      shell: bash
      env:
        SOURCE_REPOSITORY: ${{ inputs.repository }}
        SOURCE_TOKEN: ${{ inputs.token }}
        SOURCE_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        if [[ ! "$SOURCE_REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
          echo '::error::BUILD_INPUT_REPOSITORY must have the format owner/repository.'
          exit 1
        fi
        if [[ ! "$SOURCE_REF" =~ ^[a-zA-Z0-9_.-]+$ || -z "$SOURCE_TOKEN" ]]; then
          echo '::error::Invalid branch name or missing token.'
          exit 1
        fi
        dest="$RUNNER_TEMP/build-input-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        archive="$RUNNER_TEMP/private-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
        test ! -e "$dest" || { echo '::error::Temporary source destination already exists.'; exit 1; }
        trap 'rm -f -- "$archive"' EXIT
        # This API explicitly supports fine-grained PATs with Contents: read.
        # Do not print the token, archive, response body, or private source paths.
        code="$(curl --silent --show-error --location \
          --retry 2 --retry-delay 1 \
          --output "$archive" --write-out '%{http_code}' \
          --header 'Accept: application/vnd.github+json' \
          --header "Authorization: Bearer $SOURCE_TOKEN" \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          "https://api.github.com/repos/$SOURCE_REPOSITORY/tarball/$SOURCE_REF")"
        if [[ "$code" != '200' ]]; then
          case "$code" in
            401) echo '::error::GitHub refused the credential (HTTP 401). Update BUILD_INPUT_READ_TOKEN.' ;;
            403) echo '::error::GitHub denied access (HTTP 403). Ensure the fine-grained token selects the PRIVATE repo and has Repository permissions > Contents > Read-only.' ;;
            404) echo '::error::GitHub could not access the private repository (HTTP 404). Check BUILD_INPUT_REPOSITORY and the token repository selection.' ;;
            *) echo "::error::GitHub archive request failed (HTTP $code)." ;;
          esac
          exit 1
        fi
        tar -tzf "$archive" >/dev/null || { echo '::error::Private archive verification failed.'; exit 1; }
        mkdir -m 700 "$dest"
        tar -xzf "$archive" --strip-components=1 -C "$dest"
        printf 'directory=%s\n' "$dest" >> "$GITHUB_OUTPUT"
        echo 'Private dependency archive fetched into ephemeral runner storage (not deployed).'
