name: Everflow complete Exam browser verification
on:
  workflow_dispatch:
  # Runs once when installed/edited, not after every unrelated deployment.
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/everflow-full-e2e.yml"

permissions:
  contents: read

jobs:
  full-exam-e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public application
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read already-configured private template source (temporary files only)
        uses: ./.github/actions/build-input
        id: private
        with:
          repository: ${{ secrets.BUILD_INPUT_REPOSITORY }}
          token: ${{ secrets.BUILD_INPUT_READ_TOKEN }}

      - name: Assemble test ZIP without committing, uploading or logging private files
        shell: bash
        env:
          INPUT_DIR: ${{ steps.private.outputs.directory }}
          PRIVATE_TEMPLATE_ZIP: ${{ runner.temp }}/everflow-private-e2e.zip
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ["INPUT_DIR"])
          archive = pathlib.Path(os.environ["PRIVATE_TEMPLATE_ZIP"])
          if not (root/"Everflow-Exam.tex").is_file():
              raise SystemExit("Private input does not contain a compatible LaTeX Exam entrypoint")
          dirs = {
              "00-user-config", "90-core", "assets", "config", "core", "covers",
              "custom-pages", "exam-pages", "figures", "frontmatter", "img",
              "public-pages", "questions", "styles"
          }
          count = 0
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=5) as z:
              for p in root.rglob("*"):
                  if not p.is_file() or p.is_symlink():
                      continue
                  rel = p.relative_to(root)
                  if rel.parts[0] not in dirs and rel.as_posix() not in {
                      "Everflow-Exam.tex", "Everflow-Book.tex", "Everflow-Public.tex"
                  }:
                      continue
                  if p.stat().st_size > 25*1024*1024:
                      raise SystemExit("Private input has a resource too large for safe browser import")
                  # Complete original question list: no edits or shortcuts.
                  z.write(p, rel.as_posix())
                  count += 1
          if count < 15 or archive.stat().st_size > 32*1024*1024:
              raise SystemExit("Private LaTeX archive failed limits check")
          print("Temporary private LaTeX ZIP prepared; contents deliberately not logged.")
          PY

      - name: Install headless Chromium and PDF analysis utilities
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          command -v pdftotext && command -v pdfinfo && command -v pdffonts || { sudo apt-get update && sudo apt-get install -y poppler-utils; }

      - name: Install reference XeLaTeX packages within free public-runner allocation
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-plain-generic texlive-science texlive-fonts-recommended \
            fonts-texgyre fonts-texgyre-math fonts-oflb-asana-math fonts-noto-cjk

      - name: Compile private full Exam as local-only baseline
        shell: bash
        env:
          PRIVATE_DIR: ${{ steps.private.outputs.directory }}
          BASELINE_DIR: ${{ runner.temp }}/everflow-reference
        run: |
          set -euo pipefail
          mkdir -p "$BASELINE_DIR"
          for pass in 1 2; do
            if ! ( cd "$PRIVATE_DIR" && xelatex -no-shell-escape \
                -interaction=nonstopmode -halt-on-error -file-line-error \
                "-output-directory=$BASELINE_DIR" Everflow-Exam.tex \
                > "$BASELINE_DIR/tex-build.log" 2>&1 ); then
              echo "::error::Local XeLaTeX reference failed; protected compile logs omitted."
              exit 1
            fi
          done
          test -s "$BASELINE_DIR/Everflow-Exam.pdf" || {
            echo "::error::Local XeLaTeX reference PDF not generated."
            exit 1
          }
          echo "Private XeLaTeX baseline generated outside the public workspace."

      - name: Verify complete original private Exam using BusyTeX in real browser
        env:
          PRIVATE_TEMPLATE_ZIP: ${{ runner.temp }}/everflow-private-e2e.zip
          EVERFLOW_REDUCED_MODE: "0"
          PRIVATE_LOCAL_BASELINE_PDF: ${{ runner.temp }}/everflow-reference/Everflow-Exam.pdf
        run: node scripts/smoke-everflow-private.cjs

      - name: Erase all private runner storage
        if: always()
        shell: bash
        env:
          PRIVATE_DIR: ${{ steps.private.outputs.directory }}
          PRIVATE_TEMPLATE_ZIP: ${{ runner.temp }}/everflow-private-e2e.zip
        run: |
          rm -f -- "$PRIVATE_TEMPLATE_ZIP"
          BASELINE_DIR="$RUNNER_TEMP/everflow-reference"
          if [[ -d "$BASELINE_DIR" ]]; then rm -rf -- "$BASELINE_DIR"; fi
          if [[ -n "$PRIVATE_DIR" && "$PRIVATE_DIR" == "$RUNNER_TEMP"/* ]]; then
            rm -rf -- "$PRIVATE_DIR"
          fi
