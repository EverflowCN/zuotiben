name: Paper homepage quick flow verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper/index.html'
      - 'paper/app.js'
      - 'paper/quick-flow.css'
      - 'scripts/paper-quick-flow-smoke.cjs'
      - '.github/workflows/paper-quick-flow.yml'
permissions:
  contents: read
concurrency:
  group: paper-quick-flow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify Doubao-to-Everflow onboarding
        run: |
          mkdir -p test-results
          python3 -m http.server 8765 &
          node scripts/paper-quick-flow-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-onboarding-desktop-mobile
          path: test-results/
