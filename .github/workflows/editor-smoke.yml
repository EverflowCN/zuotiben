name: Editor browser and PDF verification
on:
  push:
    branches: [main]
    paths: ['paper/**', 'scripts/editor-smoke.cjs', '.github/workflows/editor-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify editing, Typst preview, responsive layout and PDF download
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p test-results
          python3 -m http.server 8765 &
          node scripts/editor-smoke.cjs
          if [ "$BROWSER" = "chromium" ]; then
            command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
            pdftotext -layout test-results/editor.pdf test-results/editor.txt
            if grep -q '第0页' test-results/editor.txt; then
              echo "Body page numbering incorrectly starts at 0"
              exit 1
            fi
            grep -q '第1页/共2页' test-results/editor.txt
            grep -q '第2页/共2页' test-results/editor.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-verification-${{ matrix.browser }}
          path: test-results/
