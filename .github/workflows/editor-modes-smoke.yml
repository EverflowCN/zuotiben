name: Editor physical mode verification
on:
  push:
    branches: [main]
    paths:
      - 'paper/editor/**'
      - 'scripts/editor-modes-smoke.cjs'
      - '.github/workflows/editor-modes-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-modes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify physical paper modes
        run: |
          python3 -m http.server 8765 &
          node scripts/editor-modes-smoke.cjs
