name: Editor math and UI focused verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper/editor/safe-math.js'
      - 'paper/editor/lucide-ui.js'
      - 'paper/editor/polish-20261013.css'
      - 'paper/editor/editor.js'
      - 'paper/editor/index.html'
      - 'scripts/editor-math-ui-smoke.cjs'
      - '.github/workflows/editor-math-ui.yml'
permissions:
  contents: read
concurrency:
  group: focused-editor-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/install-pdf-vendor.sh
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check safe math and 3-device UI
        run: |
          mkdir -p test-results
          python3 -m http.server 8765 &
          node scripts/editor-math-ui-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everflow-safe-math-ui-screenshots
          path: test-results/
