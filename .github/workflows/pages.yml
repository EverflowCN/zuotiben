name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Keep the embedded source aligned with edits made in EverflowCN/aldine.
  schedule:
    - cron: "17 2,14 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node for Aldine
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mirror all files from EverflowCN/aldine to /latex/aldine
        run: bash scripts/sync-aldine.sh

      - name: Build real Aldine React frontend for /latex/
        run: |
          cd latex/aldine
          npm ci --no-audit --no-fund
          npm run build -w apps/web
          cd ../..
          node scripts/aldine-build-preview.mjs
          rm -rf latex/aldine/node_modules latex/aldine/apps/web/dist
          find latex/aldine -type d -name node_modules -prune -exec rm -rf {} +

      - name: Commit fork source and compiled preview into website repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A latex/aldine latex/index.html latex/assets latex/.aldine-source-rev
          if ! git diff --cached --quiet; then
            git commit -m "chore(latex): sync Aldine fork and publish updated preview"
            # Parallel edits can advance main while the build is running.
            # Rebase only this bot-generated commit and retry without force-pushing.
            pushed=0
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              sleep 2
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Could not push sync commit after 3 attempts" >&2
              exit 1
            fi
          else
            echo "Aldine source and preview already up to date"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Vendor local PDF libraries
        run: bash scripts/install-pdf-vendor.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
