name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Build the Pages artifact from EverflowCN/aldine on each run.
  schedule:
    - cron: "17 2,14 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node for Aldine
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mirror all files from EverflowCN/aldine to /latex/aldine
        run: bash scripts/sync-aldine.sh

      - name: Build real Aldine React frontend for /latex/
        run: |
          cd latex/aldine
          npm ci --no-audit --no-fund
          npm test -w apps/web -- latex-
          npm run typecheck -w apps/web
          npm run build -w apps/web
          cd ../..
          node scripts/aldine-build-preview.mjs
          rm -rf latex/aldine/node_modules latex/aldine/apps/web/dist
          find latex/aldine -type d -name node_modules -prune -exec rm -rf {} +

      # Deploy the just-built Aldine frontend directly from the current
      # workflow workspace. Never push generated Vite asset filenames back to
      # main: concurrent edits otherwise cause rename/rename rebase conflicts.
      # EverflowCN/aldine remains the upstream source of truth.

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Vendor local PDF libraries
        run: bash scripts/install-pdf-vendor.sh

      - name: Cache GitHub-hosted BusyTeX core and optional TeX Live collections
        uses: actions/cache@v4
        with:
          path: latex/browser-test/core/busytex
          key: busytex-three-collections-v1.4.x-46ebb621-a1

      - name: Build browser-only BusyTeX test from own fork
        run: bash scripts/build-busytex-browser.sh

      - name: Audit Everflow package coverage against pinned TeX Live manifests
        run: python3 scripts/analyze-everflow-runtime.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
