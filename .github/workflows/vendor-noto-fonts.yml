name: Vendor Noto Serif SC webfonts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-noto-fonts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pinned Noto Serif SC webfonts
        shell: bash
        run: |
          set -euo pipefail
          FONT_REF="06f53947263a78864be892cc6548e24d2c3516ae"
          BASE="https://raw.githubusercontent.com/fontsource/font-files/${FONT_REF}/fonts/google/noto-serif-sc"
          mkdir -p paper/assets/fonts
          curl --fail --location --retry 3             "${BASE}/files/noto-serif-sc-chinese-simplified-400-normal.woff2"             --output paper/assets/fonts/noto-serif-sc-chinese-simplified-400-normal.woff2
          curl --fail --location --retry 3             "${BASE}/files/noto-serif-sc-chinese-simplified-700-normal.woff2"             --output paper/assets/fonts/noto-serif-sc-chinese-simplified-700-normal.woff2
          curl --fail --location --retry 3             "${BASE}/LICENSE"             --output paper/assets/fonts/OFL.txt

          cat > paper/assets/fonts/README.md <<'EOF'
          # Local Noto Serif SC webfonts

          These files are vendored for the paper/editor preview so Chinese serif text renders consistently across browsers.

          Source: fontsource/font-files, package noto-serif-sc
          Upstream font: Noto Serif CJK SC / Noto Serif SC
          Pinned source commit: 06f53947263a78864be892cc6548e24d2c3516ae
          Weights included: 400 and 700
          Format: WOFF2
          License: SIL Open Font License 1.1 (see OFL.txt)
          EOF

      - name: Commit vendored font assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/assets/fonts
          git rm --ignore-unmatch .github/workflows/vendor-noto-fonts.yml
          if git diff --cached --quiet; then
            echo "No font changes to commit."
            exit 0
          fi
          git commit -m "assets: vendor Noto Serif SC webfonts"
          git push origin HEAD:main
