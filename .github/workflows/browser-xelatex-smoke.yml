name: BusyTeX browser PDF smoke test
on:
  workflow_dispatch:
  # Run after the actual Pages rollout, not concurrently with its build.
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install headless Chromium and Playwright
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Compile minimal XeLaTeX and assert PDF download
        run: node scripts/smoke-browser-xelatex.cjs
