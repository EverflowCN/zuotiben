name: Vendor Typst runtime

on:
  push:
    paths:
      - ".github/workflows/vendor-typst-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download pinned Typst browser runtime
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.7.0"
          DIR="paper/assets/vendor/typst"
          mkdir -p "$DIR"

          curl -fL --retry 3             "https://cdn.jsdelivr.net/npm/@myriaddreamin/typst.ts@${VERSION}/dist/esm/contrib/all-in-one-lite.bundle.js"             -o "$DIR/typst-all-in-one-lite.js"

          curl -fL --retry 3             "https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-web-compiler@${VERSION}/pkg/typst_ts_web_compiler_bg.wasm"             -o "$DIR/typst_ts_web_compiler_bg.wasm"

          curl -fL --retry 3             "https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-renderer@${VERSION}/pkg/typst_ts_renderer_bg.wasm"             -o "$DIR/typst_ts_renderer_bg.wasm"

          curl -fL --retry 3             "https://raw.githubusercontent.com/Myriad-Dreamin/typst.ts/main/LICENSE"             -o "$DIR/LICENSE"

          printf '%s\n' "$VERSION" > "$DIR/VERSION"

          FONT_DIR="$DIR/fonts"
          mkdir -p "$FONT_DIR"

          FANDOL_REF="b93300821373d3092e378e57ae22ecb8e9082c62"
          curl -fL --retry 3 "https://raw.githubusercontent.com/Yixf-Self/fandol-fonts/$FANDOL_REF/FandolSong-Regular/FandolSong-Regular.otf" -o "$FONT_DIR/FandolSong-Regular.otf"
          curl -fL --retry 3 "https://raw.githubusercontent.com/Yixf-Self/fandol-fonts/$FANDOL_REF/FandolSong-Bold/FandolSong-Bold.otf" -o "$FONT_DIR/FandolSong-Bold.otf"
          curl -fL --retry 3 "https://raw.githubusercontent.com/Yixf-Self/fandol-fonts/$FANDOL_REF/FandolHei-Regular/FandolHei-Regular.otf" -o "$FONT_DIR/FandolHei-Regular.otf"
          curl -fL --retry 3 "https://raw.githubusercontent.com/Yixf-Self/fandol-fonts/$FANDOL_REF/FandolHei-Bold/FandolHei-Bold.otf" -o "$FONT_DIR/FandolHei-Bold.otf"
          curl -fL --retry 3 "https://raw.githubusercontent.com/Yixf-Self/fandol-fonts/$FANDOL_REF/FandolKai-Regular/FandolKai-Regular.otf" -o "$FONT_DIR/FandolKai-Regular.otf"
          curl -fL --retry 3 "https://raw.githubusercontent.com/Yixf-Self/fandol-fonts/$FANDOL_REF/COPYING" -o "$FONT_DIR/FANDOL-COPYING"

          # Exact western text family used by the current XeLaTeX master.
          TERMES_BASE="https://ctan.csail.mit.edu/fonts/newtx/opentype"
          curl -fL --retry 3 "$TERMES_BASE/TeXGyreTermesX-Regular.otf" -o "$FONT_DIR/TeXGyreTermesX-Regular.otf"
          curl -fL --retry 3 "$TERMES_BASE/TeXGyreTermesX-Bold.otf" -o "$FONT_DIR/TeXGyreTermesX-Bold.otf"
          curl -fL --retry 3 "$TERMES_BASE/TeXGyreTermesX-Italic.otf" -o "$FONT_DIR/TeXGyreTermesX-Italic.otf"
          curl -fL --retry 3 "https://ctan.csail.mit.edu/fonts/newtx/README" -o "$FONT_DIR/NEWTX-README"

          XITS_REF="master"
          curl -fL --retry 3 "https://raw.githubusercontent.com/aliftype/xits/$XITS_REF/XITS-Regular.otf" -o "$FONT_DIR/XITS-Regular.otf"
          curl -fL --retry 3 "https://raw.githubusercontent.com/aliftype/xits/$XITS_REF/XITS-Bold.otf" -o "$FONT_DIR/XITS-Bold.otf"
          curl -fL --retry 3 "https://raw.githubusercontent.com/aliftype/xits/$XITS_REF/XITSMath-Regular.otf" -o "$FONT_DIR/XITSMath-Regular.otf"
          curl -fL --retry 3 "https://raw.githubusercontent.com/aliftype/xits/$XITS_REF/OFL.txt" -o "$FONT_DIR/XITS-OFL.txt"

          # Worker compatibility patch for the upstream all-in-one browser bundle.
          # ESM exports are usable in a Worker, but upstream also assigns two globals to window.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("paper/assets/vendor/typst/typst-all-in-one-lite.js")
          s = p.read_text()
          old = 'window.$typst = Ie;\nwindow.TypstSnippet = U;'
          new = 'if (typeof window < "u") {\n  window.$typst = Ie;\n  window.TypstSnippet = U;\n}'
          if old in s:
              p.write_text(s.replace(old, new))
          elif new not in s:
              raise SystemExit("Typst worker compatibility anchor not found")
          PY

          test -s "$DIR/typst-all-in-one-lite.js"
          test -s "$DIR/typst_ts_web_compiler_bg.wasm"
          test -s "$DIR/typst_ts_renderer_bg.wasm"
          test -s "$FONT_DIR/FandolSong-Regular.otf"
          test -s "$FONT_DIR/FandolHei-Regular.otf"
          test -s "$FONT_DIR/FandolKai-Regular.otf"
          test -s "$FONT_DIR/TeXGyreTermesX-Regular.otf"
          test -s "$FONT_DIR/TeXGyreTermesX-Bold.otf"
          test -s "$FONT_DIR/TeXGyreTermesX-Italic.otf"
          test -s "$FONT_DIR/XITSMath-Regular.otf"

          MITEX_VERSION="0.2.7"
          MITEX_DIR="$DIR/mitex"
          rm -rf "$MITEX_DIR" /tmp/mitex-package
          mkdir -p "$MITEX_DIR" /tmp/mitex-package
          curl -fL --retry 3             "https://packages.typst.org/preview/mitex-$MITEX_VERSION.tar.gz"             -o /tmp/mitex.tar.gz
          tar -xzf /tmp/mitex.tar.gz -C /tmp/mitex-package
          cp -a /tmp/mitex-package/. "$MITEX_DIR/"
          find "$MITEX_DIR" -type f -printf '%P\n' | LC_ALL=C sort > "$MITEX_DIR/manifest.txt"
          test -s "$MITEX_DIR/lib.typ"
          test -s "$MITEX_DIR/mitex.typ"
          test -s "$MITEX_DIR/mitex.wasm"
          test -s "$MITEX_DIR/manifest.txt"
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("paper/assets/vendor/typst/mitex")
          files = sorted(
              p.relative_to(root).as_posix()
              for p in root.rglob("*")
              if p.is_file() and p.name != "manifest.json"
          )
          (root / "manifest.json").write_text(
              json.dumps({"version":"0.2.7","files":files}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
          test -s "$MITEX_DIR/manifest.json"

          # Extract the exact existing watermark PNG from paper/styles.css.
          python3 - <<'PY'
          import base64, pathlib, re
          css = pathlib.Path("paper/styles.css").read_text(encoding="utf-8")
          m = re.search(r'background-image:url\("data:image/png;base64,([^"]+)"\)', css)
          if not m:
              raise SystemExit("embedded watermark PNG not found")
          out = pathlib.Path("paper/assets/watermark/water.png")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(base64.b64decode(m.group(1)))
          PY
          test -s "paper/assets/watermark/water.png"

      - name: Commit vendored runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/assets/vendor/typst
          if git diff --cached --quiet; then
            echo "Typst runtime already vendored."
            exit 0
          fi
          git commit -m "chore(paper): vendor Typst 0.7.0 browser runtime"
          git push origin HEAD:main
