name: Paper root and pane autofit verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'library/index.html'
      - 'paper/index.html'
      - 'paper/book-showcase.css'
      - 'paper/book-showcase.js'
      - 'paper/editor/pane-autofit.css'
      - 'paper/editor/editor.js'
      - 'paper/editor/index.html'
      - 'scripts/paper-root-autofit-smoke.cjs'
      - '.github/workflows/paper-root-autofit.yml'
permissions:
  contents: read
concurrency:
  group: paper-root-autofit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/install-pdf-vendor.sh
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify site homepage, animated covers and resizable PDF preview
        run: |
          mkdir -p test-results
          python3 -m http.server 8765 &
          node scripts/paper-root-autofit-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-home-book-showcase-and-autofit
          path: test-results/
