<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio API Diagnostic</title></head>
<body>
<pre id="out">running…</pre>
<script>
(async()=>{
  const out=document.getElementById('out');
  const base='https://api.zuotiben.top';
  const results={origin:location.origin,userAgent:navigator.userAgent,tests:[]};
  async function test(path,options={}){
    const row={path};
    try{
      const r=await fetch(base+path,{credentials:'include',cache:'no-store',...options});
      row.ok=r.ok;row.status=r.status;row.type=r.type;row.url=r.url;
      row.acao=r.headers.get('access-control-allow-origin');
      row.acac=r.headers.get('access-control-allow-credentials');
      row.contentType=r.headers.get('content-type');
      const text=await r.text();
      row.body=text.slice(0,1000);
    }catch(e){
      row.fetchError=String(e&&e.message||e);
      row.name=e&&e.name||'';
    }
    results.tests.push(row);
  }
  await test('/health');
  await test('/auth/setup/status');
  await test('/admin/bootstrap');
  out.textContent=JSON.stringify(results,null,2);
})();
</script>
</body>
</html>
