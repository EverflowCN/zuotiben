<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f6f0e5">
  <script>if(location.hostname==='zuotiben.top'&&location.protocol==='http:'){location.replace('https://'+location.host+location.pathname+location.search+location.hash)}</script>
  <title>Studio</title>
  <link rel="stylesheet" href="./styles.css?v=20260920-studio14">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="side-head">
        <div class="side-brand"><span class="brand-mark">研</span><div><strong>Studio</strong><small>资源管理</small></div></div>
        <button id="sideClose" class="icon-btn side-close" type="button" aria-label="关闭导航" data-icon="x"></button>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="side-foot">
        <button id="accountEntry" class="identity identity-button" type="button">
          <span class="avatar">主</span>
          <span><strong>主管理员</strong><small>Owner · 账号中心</small></span>
        </button>
        <button id="logoutButton" class="icon-btn" type="button" aria-label="退出工作台" data-icon="logout"></button>
      </div>
    </aside>

    <div id="sideBackdrop" class="side-backdrop" hidden></div>

    <section class="workspace">
      <header class="topbar">
        <button id="sideOpen" class="icon-btn mobile-only" type="button" aria-label="打开导航" data-icon="menu"></button>
        <div class="top-title">
          <span id="topEyebrow">OVERVIEW</span>
          <strong id="topTitle">概览</strong>
        </div>
        <label class="global-search">
          <span data-icon="search"></span>
          <input id="globalSearch" placeholder="搜索资源、勘误、公告或成员">
          <kbd>⌘K</kbd>
        </label>
        <div class="top-actions">
          <span class="workspace-status"><i></i>界面预览</span>
          <button id="openPublic" class="btn subtle" type="button">查看前台</button>
        </div>
      </header>

      <div id="panelHost" class="panel-host"></div>
    </section>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="编辑面板"></aside>

  <div id="modalBackdrop" class="modal-backdrop" hidden></div>
  <section id="confirmModal" class="confirm-modal" hidden role="dialog" aria-modal="true"></section>

  <div id="toastStack" class="toast-stack"></div>
  <script src="./app.js?v=20260920-studio19"></script>
</body>
</html>
