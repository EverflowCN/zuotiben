<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f6f0e5">
  <title>Studio</title>
  <link rel="stylesheet" href="./styles.css?v=20260919-studio1">
</head>
<body>
  <main id="gate" class="gate">
    <section class="gate-card">
      <div class="gate-mark">研</div>
      <div class="eyebrow">PRIVATE WORKSPACE</div>
      <h1>研库 Studio</h1>
      <p>仅授权成员可进入。身份服务接入后，未通过验证的访问不会加载任何管理数据。</p>
      <button id="verifyButton" class="btn primary" type="button">验证身份</button>
      <div id="gateStatus" class="gate-status">身份服务尚未接入。</div>
    </section>
  </main>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="side-head">
        <div class="side-brand"><span class="brand-mark">研</span><div><strong>Studio</strong><small>资源管理</small></div></div>
        <button id="sideClose" class="icon-btn side-close" type="button" aria-label="关闭导航" data-icon="x"></button>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="side-foot">
        <div class="identity">
          <span class="avatar">主</span>
          <div><strong>主管理员</strong><small>Owner · 全部权限</small></div>
        </div>
        <button class="icon-btn" type="button" aria-label="退出工作台" data-icon="logout"></button>
      </div>
    </aside>

    <div id="sideBackdrop" class="side-backdrop" hidden></div>

    <section class="workspace">
      <header class="topbar">
        <button id="sideOpen" class="icon-btn mobile-only" type="button" aria-label="打开导航" data-icon="menu"></button>
        <div class="top-title">
          <span id="topEyebrow">OVERVIEW</span>
          <strong id="topTitle">概览</strong>
        </div>
        <label class="global-search">
          <span data-icon="search"></span>
          <input id="globalSearch" placeholder="搜索资源、勘误、公告或成员">
          <kbd>⌘K</kbd>
        </label>
        <div class="top-actions">
          <button id="openPublic" class="btn subtle" type="button">查看前台</button>
          <button id="quickCreate" class="btn primary" type="button">＋ 新建</button>
        </div>
      </header>

      <div id="panelHost" class="panel-host"></div>
    </section>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="编辑面板"></aside>

  <div id="modalBackdrop" class="modal-backdrop" hidden></div>
  <section id="confirmModal" class="confirm-modal" hidden role="dialog" aria-modal="true"></section>

  <div id="toastStack" class="toast-stack"></div>
  <script src="./app.js?v=20260919-studio1"></script>
</body>
</html>
