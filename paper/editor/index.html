<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Everflow 本地试卷编辑器">
  <title>试卷编辑器 · 研库</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.3.0/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.3.0/700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.3.0/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.3.0/700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/temml@0.13.5/dist/Temml-Local.css">
  <link rel="stylesheet" href="../styles.css?v=20260921-editor1">
  <link rel="stylesheet" href="./editor.css?v=20260921-direct1">
</head>
<body class="editor-page">
<header class="editor-topbar">
  <div class="editor-brand-wrap">
    <a class="brand" href="../" aria-label="返回本地组卷入口">
      <span class="brand-mark">E</span>
      <span>Everflow<small>研库 · 试卷编辑器</small></span>
    </a>
    <span class="local-pill"><i></i> 本地编辑</span>
  </div>
  <div class="editor-top-actions">
    <button class="ghost-btn" id="templateButton" type="button">模板：Exam</button>
    <button class="ghost-btn" id="saveProjectButton" type="button">保存 .everflow</button>
    <button class="primary-btn" id="compileModeButton" type="button">进入编译模式</button>
  </div>
</header>

<main class="editor-shell">
  <aside class="editor-sidebar">
    <div class="sidebar-head">
      <div>
        <span>QUESTIONS</span>
        <strong id="paperName">未命名试卷</strong>
      </div>
      <b id="questionCount">0</b>
    </div>
    <div class="sidebar-note">拖动题目调整顺序。后续题干、选项、题型、大题与间距编辑都放在这里。</div>
    <div class="order-list" id="orderList"></div>
    <footer class="sidebar-foot">
      <a class="text-btn" href="../">重新导入</a>
      <button class="text-btn" id="resetOrderButton" type="button">恢复顺序</button>
      <button class="text-btn danger" id="clearButton" type="button">清空</button>
    </footer>
  </aside>

  <section class="editor-main">
    <div class="editor-toolbar">
      <div>
        <span>PREVIEW</span>
        <strong>Everflow 固定模板预览</strong>
        <small id="sourceName">浏览器本地文件</small>
      </div>
      <div class="editor-toolbar-actions">
        <span class="preview-chip">A4</span>
        <span class="preview-chip"><i></i> 本地渲染</span>
        <button class="ghost-btn" id="printButton" type="button">下载 PDF</button>
      </div>
    </div>

    <div class="compile-bar" id="compileBar" hidden>
      <div class="compile-bar-copy">
        <span>EVERFLOW COMPILE MODE</span>
        <strong>编译模式 · 固定模板</strong>
        <small>本地浏览器排版；整题可移动，模板字体与版式锁定。</small>
      </div>
      <div class="compile-bar-actions">
        <button class="ghost-btn" id="compileOrderButton" type="button">题目移动：开启</button>
        <button class="ghost-btn" id="compileExitButton" type="button">退出编译模式</button>
        <button class="primary-btn" id="compilePrintButton" type="button">下载 PDF</button>
      </div>
    </div>

    <div class="paper-stage">
      <article class="paper-sheet" id="paperSheet">
        <div class="paper-running-head" aria-hidden="true">Everflow·彼时流年若水</div>
        <div class="paper-watermark" aria-hidden="true"></div>
        <aside class="paper-qr" aria-label="zuotiben.top 二维码">
          <div class="paper-qr-code"><img src="../assets/zuotiben-qr.svg" alt="" aria-hidden="true"></div>
          <span>zuotiben.top</span>
        </aside>
        <header class="paper-header">
          <h1 id="previewTitle">试卷</h1>
          <p id="previewMeta">本地排版</p>
        </header>
        <main class="paper-questions" id="paperQuestions"></main>
        <footer class="paper-footer">
          <span>Everflow·彼时流年若水</span>
          <span>第 <b id="previewPageCurrent">1</b> 页（共 <b id="previewPageTotal">1</b> 页）</span>
        </footer>
      </article>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script defer src="https://cdn.jsdelivr.net/npm/temml@0.13.5/dist/temml.min.js"></script>
<script src="./editor.js?v=20260921-direct1"></script>
</body>
</html>
